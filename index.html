<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>사과 숫자 퍼즐 · Apple Ten</title>
<style>
:root{font-family:'Segoe UI','Malgun Gothic',sans-serif;color:#354238;background:#fbf8ef}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 15% 10%,#fff2db,transparent 35%),#fbf8ef;padding:26px 12px}.wrap{max-width:820px;margin:auto;text-align:center}.eyebrow{letter-spacing:.23em;text-transform:uppercase;font-size:12px;font-weight:800;color:#9a8569}h1{font-size:clamp(28px,5vw,42px);margin:5px 0 7px;color:#365b3d}header p{margin:0 0 20px;color:#657364;font-size:15px;line-height:1.6}.panel{display:flex;gap:12px;align-items:stretch;justify-content:center;flex-wrap:wrap;margin:16px 0}.stat{background:white;border:1px solid #e7e8d9;border-radius:17px;min-width:125px;padding:10px 18px;box-shadow:0 5px 20px #3c4d2410}.stat small{display:block;color:#75816f;font-size:12px;margin-bottom:2px}.stat strong{font-size:26px;color:#35583a;font-variant-numeric:tabular-nums}.stat strong.warn{color:#c94843}button{font:inherit;cursor:pointer;border:0;background:#417d50;color:white;font-weight:800;border-radius:15px;padding:13px 21px;box-shadow:0 5px 0 #2d6039;transition:transform .15s}button:hover{background:#346d43}button:active{transform:translateY(3px);box-shadow:0 2px 0 #2d6039}.board-shell{padding:15px;border-radius:25px;background:#eaf0dc;border:2px solid #d4e0c6;box-shadow:0 12px 35px #4c5f3d15}.board{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:6px;touch-action:none;user-select:none}.cell{aspect-ratio:1;min-width:0;position:relative;display:grid;place-items:center;cursor:crosshair;isolation:isolate}.apple{position:relative;width:91%;height:84%;margin-top:8%;border-radius:41% 41% 44% 44% / 39% 39% 51% 51%;background:linear-gradient(145deg,#ff8a7b 0%,#ee514c 42%,#c9343d 100%);box-shadow:inset -5px -5px 8px #9d263023,inset 4px 4px 8px #ffddd56b,0 3px 0 #aa3e3c;display:grid;place-items:center;color:white;font-size:clamp(13px,2.7vw,23px);font-weight:900;text-shadow:0 1px 2px #7e1e2370;transition:transform .13s,filter .13s,opacity .22s}.apple:before{content:'';position:absolute;top:-10%;left:50%;width:20%;height:17%;background:#5c9c51;border-radius:100% 0 100% 0;transform:rotate(-28deg)}.apple:after{content:'';position:absolute;top:-10%;left:46%;width:3px;height:13%;background:#795b39;border-radius:3px;transform:rotate(18deg)}.cell.selected .apple{transform:translateY(-3px) scale(1.07);filter:brightness(1.13);outline:3px solid #f9bf42;outline-offset:2px;box-shadow:0 0 0 5px #ffdf7a7a,0 7px 12px #b54c3850}.cell.selected .apple:before{background:#378c42}.cell.empty{cursor:crosshair}.cell.empty .apple{display:none}.cell.removing .apple{animation:pop .35s ease-in forwards}@keyframes pop{0%{transform:scale(1);opacity:1}45%{transform:scale(1.23) rotate(-8deg);opacity:1;filter:brightness(1.35)}100%{transform:scale(.1) rotate(20deg);opacity:0}}.feedback{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;margin:17px auto 7px;min-height:52px}.sum{background:white;border:2px solid #e4dfc9;border-radius:14px;padding:10px 16px;font-weight:900;color:#766e5c}.sum.valid{border-color:#61a66b;background:#e9f8e8;color:#277342}.sum.invalid{border-color:#efbf75;color:#a96a26}.message{font-size:15px;font-weight:700;color:#527259;min-height:24px}.hint{font-size:13px;color:#7e8a79}.overlay{position:fixed;inset:0;background:#2032259e;display:grid;place-items:center;padding:20px;z-index:10}.overlay[hidden]{display:none}.modal{width:min(420px,100%);padding:34px 24px;background:#fffdf6;border-radius:26px;box-shadow:0 24px 65px #1421185c;text-align:center}.modal .emoji{font-size:55px}.modal h2{font-size:30px;color:#355b3e;margin:10px 0}.modal p{color:#687868}.modal strong{font-size:40px;color:#c74743}.modal button{margin-top:18px}@media(max-width:560px){body{padding:17px 7px}.board-shell{padding:8px;border-radius:17px}.board{gap:3px}.stat{min-width:90px;padding:8px 12px}.stat strong{font-size:21px}.panel button{padding:11px 14px}.apple{font-size:clamp(12px,3.2vw,19px)}.cell.selected .apple{outline-width:2px;outline-offset:0}}
</style>
</head>
<body>
<main class="wrap">
<header><div class="eyebrow">Apple Ten · Mini Puzzle</div><h1>🍎 사과 숫자 퍼즐</h1><p>드래그해서 사과들을 직사각형으로 선택하세요.<br>숫자의 합이 <b>10</b>이면 사과가 사라져요!</p></header>
<div class="panel"><div class="stat"><small>점수</small><strong id="score">0</strong></div><div class="stat"><small>남은 시간</small><strong id="time">120</strong><small>초</small></div><button id="restart" type="button">↻ 다시 시작</button></div>
<div class="board-shell"><div id="board" class="board" aria-label="사과 숫자 퍼즐 게임판"></div></div>
<div class="feedback"><div class="sum" id="sum">선택 합계: 0 / 10</div><div class="message" id="status" aria-live="polite">사과를 선택해 보세요!</div></div>
<p class="hint">사과 하나당 1점 · 제한 시간 120초 · 첫 선택 시 타이머 시작</p>
</main>
<div class="overlay" id="overlay" hidden><div class="modal" role="dialog" aria-modal="true" aria-labelledby="endTitle"><div class="emoji">🏆🍎</div><h2 id="endTitle">게임 종료!</h2><p>최종 점수</p><strong id="finalScore">0점</strong><p id="endMessage">수고했어요!</p><button type="button" id="playAgain">다시 플레이하기</button></div></div>
<script>
const ROWS=10,COLS=10,DURATION=120;
const board=document.getElementById('board'),scoreEl=document.getElementById('score'),timeEl=document.getElementById('time'),statusEl=document.getElementById('status'),sumEl=document.getElementById('sum'),overlay=document.getElementById('overlay');
let numbers=[],score=0,timeLeft=DURATION,timer=null,started=false,dragging=false,startCell=null,endCell=null,ended=false,animating=false,animationTimeout=null;
const idx=(r,c)=>r*COLS+c;
const coords=i=>({row:Math.floor(i/COLS),col:i%COLS});
function selectedIndices(){if(startCell===null||endCell===null)return[];const a=coords(startCell),b=coords(endCell),out=[];for(let r=Math.min(a.row,b.row);r<=Math.max(a.row,b.row);r++)for(let c=Math.min(a.col,b.col);c<=Math.max(a.col,b.col);c++)out.push(idx(r,c));return out}
function render(){const selected=new Set(selectedIndices());board.innerHTML='';numbers.forEach((n,i)=>{const cell=document.createElement('div');cell.className='cell'+(n===null?' empty':'')+(selected.has(i)&&n!==null?' selected':'');cell.dataset.index=i;const apple=document.createElement('div');apple.className='apple';apple.textContent=n===null?'':String(n);cell.appendChild(apple);board.appendChild(cell)})}
function currentSelection(){const picked=selectedIndices().filter(i=>numbers[i]!==null);return {picked,sum:picked.reduce((s,i)=>s+numbers[i],0)}}
function updateStatus(){const {picked,sum}=currentSelection();sumEl.textContent=`선택 합계: ${sum} / 10`;sumEl.className='sum'+(picked.length?(sum===10?' valid':' invalid'):'');statusEl.textContent=!picked.length?'사과를 선택해 보세요!':sum===10?`좋아요! 사과 ${picked.length}개를 놓으면 제거돼요.`:`사과 ${picked.length}개 선택 중`}
function endGame(cleared=false){if(ended)return;ended=true;dragging=false;clearInterval(timer);timer=null;document.getElementById('finalScore').textContent=`${score}점`;document.getElementById('endTitle').textContent=cleared?'모두 제거했어요!':'시간 종료!';document.getElementById('endMessage').textContent=cleared?'정말 멋진 플레이였어요!':'다시 도전해서 기록을 높여 보세요.';overlay.hidden=false;statusEl.textContent=`게임 종료! 최종 점수: ${score}점`}
function beginTimer(){if(started)return;started=true;timer=setInterval(()=>{timeLeft=Math.max(0,timeLeft-1);timeEl.textContent=timeLeft;timeEl.classList.toggle('warn',timeLeft<=20);if(timeLeft===0)endGame()},1000)}
function cellFromPoint(x,y){const el=document.elementFromPoint(x,y)?.closest('.cell');return el&&board.contains(el)?Number(el.dataset.index):null}
board.addEventListener('pointerdown',e=>{if(ended||animating)return;const i=cellFromPoint(e.clientX,e.clientY);if(i===null)return;e.preventDefault();beginTimer();dragging=true;startCell=i;endCell=i;board.setPointerCapture(e.pointerId);render();updateStatus()});
board.addEventListener('pointermove',e=>{if(!dragging||ended)return;const i=cellFromPoint(e.clientX,e.clientY);if(i!==null&&i!==endCell){endCell=i;render();updateStatus()}});
function finishDrag(){if(!dragging||ended)return;dragging=false;const {picked,sum}=currentSelection();startCell=null;endCell=null;if(picked.length&&sum===10){animating=true;score+=picked.length;scoreEl.textContent=score;statusEl.textContent=`성공! 사과 ${picked.length}개를 제거했어요!`;sumEl.textContent='선택 합계: 10 / 10 ✓';sumEl.className='sum valid';const pickedSet=new Set(picked);board.querySelectorAll('.cell').forEach(cell=>{if(pickedSet.has(Number(cell.dataset.index)))cell.classList.add('removing');else cell.classList.remove('selected')});animationTimeout=setTimeout(()=>{picked.forEach(i=>numbers[i]=null);animating=false;animationTimeout=null;render();if(!ended&&numbers.every(n=>n===null))endGame(true)},360)}else{render();sumEl.textContent=`선택 합계: ${sum} / 10`;sumEl.className='sum invalid';statusEl.textContent=picked.length?`합계 ${sum} — 10이 아니에요. 다시 시도해 보세요.`:'사과를 선택해 보세요!'}}
board.addEventListener('pointerup',finishDrag);board.addEventListener('pointercancel',finishDrag);
function restart(){clearInterval(timer);clearTimeout(animationTimeout);timer=null;animationTimeout=null;started=false;dragging=false;ended=false;animating=false;startCell=null;endCell=null;score=0;timeLeft=DURATION;scoreEl.textContent=score;timeEl.textContent=timeLeft;timeEl.classList.remove('warn');overlay.hidden=true;numbers=Array.from({length:ROWS*COLS},()=>Math.random()<0.75?Math.floor(Math.random()*5)+1:Math.floor(Math.random()*4)+6);sumEl.textContent='선택 합계: 0 / 10';sumEl.className='sum';statusEl.textContent='사과를 선택해 보세요!';render()}
document.getElementById('restart').addEventListener('click',restart);document.getElementById('playAgain').addEventListener('click',restart);restart();
</script>
</body>
</html>
